<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="title desc">
  <title id="title">AgentXRay</title>
  <desc id="desc">A dark-themed hero showing a web dashboard for inspecting AI agent sessions across multiple platforms.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="0" fill="#0d1117"/>

  <g opacity="0.03">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#c9d1d9" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#c9d1d9" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#c9d1d9" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#c9d1d9" stroke-width="1"/>
  </g>

  <!-- Left: Title block -->
  <g id="title-block" transform="translate(64 44)">
    <text x="0" y="0" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" letter-spacing="2">
      DEVELOPER TOOL · OBSERVABILITY
    </text>

    <text x="0" y="48" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="700">
      AgentXRay
    </text>

    <text x="0" y="82" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">
      X-ray vision into your AI agent sessions
    </text>

    <!-- Platform pills -->
    <g transform="translate(0 110)">
      <rect x="0" y="0" width="110" height="28" rx="14" fill="#58A6FF" fill-opacity="0.1" stroke="#58A6FF" stroke-opacity="0.3" stroke-width="1"/>
      <text x="55" y="18" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" font-weight="600">OpenClaw</text>

      <rect x="118" y="0" width="80" height="28" rx="14" fill="#A371F7" fill-opacity="0.1" stroke="#A371F7" stroke-opacity="0.3" stroke-width="1"/>
      <text x="158" y="18" fill="#A371F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" font-weight="600">Codex</text>

      <rect x="206" y="0" width="120" height="28" rx="14" fill="#F778BA" fill-opacity="0.1" stroke="#F778BA" stroke-opacity="0.3" stroke-width="1"/>
      <text x="266" y="18" fill="#F778BA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" font-weight="600">Claude Code</text>

      <rect x="334" y="0" width="90" height="28" rx="14" fill="#3FB950" fill-opacity="0.1" stroke="#3FB950" stroke-opacity="0.3" stroke-width="1"/>
      <text x="379" y="18" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" font-weight="600">Hermes</text>
    </g>

    <!-- Feature highlights -->
    <g transform="translate(0 158)">
      <text x="0" y="0" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">
        Session browser · Tool call inspection · Spawn tracking · Prompt analysis
      </text>
    </g>

    <!-- Metadata -->
    <g transform="translate(0 184)">
      <rect x="0" y="0" width="100" height="24" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="50" y="16" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">Node.js</text>

      <rect x="108" y="0" width="120" height="24" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="168" y="16" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">Zero dependencies</text>

      <rect x="236" y="0" width="90" height="24" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="281" y="16" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">Offline</text>
    </g>
  </g>

  <!-- Right: Dashboard mockup -->
  <g id="dashboard" transform="translate(640 24)">
    <!-- Window frame -->
    <rect x="0" y="0" width="496" height="272" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="496" height="32" rx="10" fill="#1c2128"/>
    <rect x="0" y="22" width="496" height="10" fill="#1c2128"/>
    <circle cx="16" cy="16" r="5" fill="#FF5F56"/>
    <circle cx="32" cy="16" r="5" fill="#FFBD2E"/>
    <circle cx="48" cy="16" r="5" fill="#27C93F"/>
    <text x="248" y="20" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">AgentXRay — localhost:3800</text>

    <!-- Platform tabs -->
    <g transform="translate(12 40)">
      <rect x="0" y="0" width="72" height="24" rx="4" fill="#58A6FF" fill-opacity="0.15" stroke="#58A6FF" stroke-opacity="0.4" stroke-width="1"/>
      <text x="36" y="16" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle" font-weight="600">OpenClaw</text>

      <rect x="78" y="0" width="52" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="104" y="16" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">Codex</text>

      <rect x="136" y="0" width="82" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="177" y="16" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">Claude Code</text>

      <rect x="224" y="0" width="62" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="255" y="16" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">Hermes</text>
    </g>

    <!-- Sidebar: session list -->
    <g transform="translate(12 72)">
      <rect x="0" y="0" width="130" height="190" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>

      <!-- Session items -->
      <g transform="translate(8 8)">
        <rect x="0" y="0" width="114" height="36" rx="4" fill="#58A6FF" fill-opacity="0.08" stroke="#58A6FF" stroke-opacity="0.2" stroke-width="1"/>
        <text x="8" y="14" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">main · DM</text>
        <text x="8" y="26" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8">👤 12 🤖 18 🔧 45</text>

        <rect x="0" y="42" width="114" height="36" rx="4" fill="none" stroke="#21262d" stroke-width="0.5"/>
        <text x="8" y="56" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">cron · 每日复盘</text>
        <text x="8" y="68" fill="#484f58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8">👤 1 🤖 2 🔧 8</text>

        <rect x="0" y="84" width="114" height="36" rx="4" fill="none" stroke="#21262d" stroke-width="0.5"/>
        <text x="8" y="98" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">group · 技术群</text>
        <text x="8" y="110" fill="#484f58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8">👤 5 🤖 5 🔧 2 🔗</text>

        <rect x="0" y="126" width="114" height="36" rx="4" fill="none" stroke="#21262d" stroke-width="0.5"/>
        <text x="8" y="140" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">subagent · PR</text>
        <text x="8" y="152" fill="#484f58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8">👤 1 🤖 3 🔧 12</text>
      </g>
    </g>

    <!-- Main panel: tool calls -->
    <g transform="translate(150 72)">
      <rect x="0" y="0" width="334" height="190" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>

      <!-- Session header -->
      <g transform="translate(10 10)">
        <text x="0" y="12" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">main · DM · 高瑞林</text>
        <text x="0" y="28" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">2026-07-16 19:55 · 75 messages · 12 tool calls</text>
      </g>

      <!-- Tool call items -->
      <g transform="translate(10 48)">
        <rect x="0" y="0" width="314" height="26" rx="4" fill="#161b22"/>
        <text x="8" y="17" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">🔧 web_access_tool</text>
        <text x="200" y="17" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">action: fetch</text>

        <rect x="0" y="30" width="314" height="26" rx="4" fill="#161b22"/>
        <text x="8" y="47" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">🔧 exec</text>
        <text x="200" y="47" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">command: git push</text>

        <rect x="0" y="60" width="314" height="26" rx="4" fill="#161b22"/>
        <text x="8" y="77" fill="#A371F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">🔧 message</text>
        <text x="200" y="77" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">action: send</text>

        <rect x="0" y="90" width="314" height="26" rx="4" fill="#161b22"/>
        <text x="8" y="107" fill="#F778BA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">🔧 read</text>
        <text x="200" y="107" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">path: README.md</text>
      </g>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="64" y="305" width="180" height="3" rx="1.5" fill="url(#accent)" opacity="0.5"/>
</svg>
