name: Publish (dry-run)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload provenance bundle to the release
      id-token: write   # sigstore signing (npm --provenance, attest)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - name: Pack tarball
        id: pack
        run: echo "file=$(npm pack --ignore-scripts 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.pack.outputs.file }}
      - name: Verify bundle
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.pack.outputs.file }}.intoto.jsonl"
          ls -la *.intoto.jsonl
          gh attestation verify "${{ steps.pack.outputs.file }}" --owner alloevil
        env:
          GH_TOKEN: ${{ github.token }}
