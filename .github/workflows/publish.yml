name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload provenance bundle to the release
      id-token: write   # sigstore signing (npm --provenance, attest)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - name: Pack tarball
        id: pack
        run: echo "file=$(npm pack --ignore-scripts 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.file }}
      - name: Attach tarball and provenance to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.pack.outputs.file }}.intoto.jsonl"
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.pack.outputs.file }}" \
            "${{ steps.pack.outputs.file }}.intoto.jsonl" --clobber
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
