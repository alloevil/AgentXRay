# Monthly version updates. Minor/patch bumps are grouped into one PR per ecosystem;
# major bumps get their own PR so a red CI points at a single dependency.
# Security updates are handled separately by GitHub's alert flow.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      npm-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    # @types/node tracks the Node runtime, not the newest release: CI runs Node 22 and
    # package.json declares engines >=22.13, so types from a newer major would let code
    # use APIs that do not exist where it runs. Bump this major together with CI's node-version.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      githubactions-all:
        patterns: ["*"]
    commit-message:
      prefix: chore
